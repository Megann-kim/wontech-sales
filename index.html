<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원텍영업관리</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --bg:#f4f6f9; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:24px;height:56px;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;font-weight:700;margin:0;color:var(--blue-dark);white-space:nowrap;}
  nav{display:flex;gap:4px;}
  nav button{border:none;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;}
  nav button.active{background:var(--blue);color:#fff;}
  nav button:hover:not(.active){background:#eef2ff;}
  .order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){ .order-grid{grid-template-columns:1fr;} }
  .region-block{margin-bottom:0;min-width:0;}
  .region-block table{font-size:12px;}
  .region-block h3{font-size:13px;font-weight:700;color:var(--blue-dark);margin:0 0 8px;}
  .month-group-title{font-size:26px;font-weight:800;margin:16px 0 8px;color:var(--text);}
  .month-group-title:first-of-type{margin-top:0;}
  .total-row td{font-weight:700;background:#f9fafb;}
  .badge.미완료{background:#fffbeb;color:var(--amber);}
  .summary-table{font-size:12px;white-space:nowrap;}
  .summary-table th{text-align:center;background:#f3f4f6;color:var(--text);}
  .summary-table td{text-align:center;}
  .summary-table td.biz-name{font-weight:600;}
  .biz-input{width:100px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:inherit;}
  main{max-width:1760px;margin:0 auto;padding:24px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:800;}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
  .panel h2{font-size:15px;margin:0 0 14px;}
  .progress-bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:var(--blue);border-radius:6px;transition:width .3s;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  .table-scroll{overflow-x:auto;}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  tr:hover td{background:#f9fafb;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .toolbar .filters{display:flex;gap:6px;}
  .toolbar select,.toolbar input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  button.primary{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  button.primary:hover{background:var(--blue-dark);}
  button.ghost{background:none;border:1px solid var(--border);padding:6px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--muted);}
  button.ghost:hover{background:#f3f4f6;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.견적{background:#eef2ff;color:var(--blue-dark);}
  .badge.수주{background:#ecfdf5;color:var(--green);}
  .badge.완료{background:#f3f4f6;color:#374151;}
  .badge.실패{background:#fef2f2;color:var(--red);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:32px;width:560px;max-width:92vw;max-height:88vh;overflow:auto;}
  .modal h3{margin:0 0 22px;font-size:22px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .modal-actions button{padding:10px 20px;font-size:15px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px;}
  .row-actions{display:flex;gap:6px;}
</style>
</head>
<body>

<header>
  <h1>원텍영업관리</h1>
  <nav id="nav">
    <button data-view="dash" class="active">대시보드</button>
    <button data-view="deals">견적/수주</button>
    <button data-view="orders">수주관리</button>
  </nav>
</header>

<main id="app"></main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">견적 추가</h3>
    <div class="field"><label>거래처</label><input id="f_company" type="text" placeholder="거래처명"></div>
    <div class="field"><label>담당자</label><input id="f_contact" type="text" placeholder="담당자명"></div>
    <div class="field"><label>품목</label><input id="f_item" type="text" placeholder="품목/내용"></div>
    <div class="field"><label>금액(원)</label><input id="f_amount" type="text" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>상태</label>
      <select id="f_stage">
        <option value="견적">견적</option>
        <option value="수주">수주</option>
        <option value="완료">완료</option>
        <option value="실패">실패</option>
      </select>
    </div>
    <div class="field"><label>날짜</label><input id="f_date" type="date"></div>
    <div class="field"><label>메모</label><textarea id="f_memo" rows="2" placeholder="메모"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" id="btnCancel">취소</button>
      <button class="primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="orderModalBackdrop">
  <div class="modal">
    <h3 id="orderModalTitle">신규수주 추가</h3>
    <div class="field"><label>구분</label>
      <select id="o_region">
        <option value="국내영업-제품">국내영업-제품</option>
        <option value="해외영업">해외영업</option>
        <option value="국내영업-소모품">국내영업-소모품</option>
        <option value="Surgical">Surgical</option>
        <option value="B2C">B2C</option>
        <option value="고객만족">고객만족</option>
      </select>
    </div>
    <div class="field"><label>거래처명</label><input id="o_company" type="text" placeholder="거래처명"></div>
    <div class="field"><label>제품명</label><input id="o_item" type="text" placeholder="제품명"></div>
    <div class="field"><label>수량</label><input id="o_qty" type="text" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>단가(원)</label><input id="o_price" type="text" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>상태</label>
      <select id="o_status">
        <option value="예정">미납품(미선적)</option>
        <option value="완료">납품(선적)완료</option>
      </select>
    </div>
    <div class="field"><label id="o_dateLabel">납품(선적)예정일</label><input id="o_date" type="date"></div>
    <div class="modal-actions">
      <button class="ghost" id="btnOrderCancel">취소</button>
      <button class="primary" id="btnOrderSave">저장</button>
    </div>
  </div>
</div>

      .reduce((s,d) => s + Number(d.amount||0), 0);
    const target = Number(state.targets[thisMonth] || 0);
    const rate = target > 0 ? Math.min(100, Math.round(wonAmount/target*100)) : 0;
    const openQuotes = state.deals.filter(d => d.stage === "견적").length;
    const closedCount = dealsThisMonth.filter(d => ["수주","완료","실패"].includes(d.stage)).length;
    const wonCount = dealsThisMonth.filter(d => ["수주","완료"].includes(d.stage)).length;
    const convRate = closedCount > 0 ? Math.round(wonCount/closedCount*100) : 0;
    return { wonAmount, target, rate, openQuotes, convRate };
  }

  function render(){
    document.querySelectorAll("#nav button").forEach(b=>{
      b.classList.toggle("active", b.dataset.view === view);
    });
    const app = document.getElementById("app");
    app.innerHTML = view === "dash" ? renderDash() : view === "deals" ? renderDeals() : renderOrders();
    bindViewEvents();
  }

  function renderDash(){
    const s = computeStats();
    return `
      <div class="cards">
        <div class="card">
          <div class="label">이번 달 수주 금액</div>
          <div class="value">${fmtWon(s.wonAmount)}</div>
          <div class="sub">목표 ${fmtWon(s.target)}</div>
        </div>
        <div class="card">
          <div class="label">목표 달성률</div>
          <div class="value">${s.rate}%</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${s.rate}%"></div></div>
        </div>
        <div class="card">
          <div class="label">진행중 견적</div>
          <div class="value">${s.openQuotes}건</div>
          <div class="sub">아직 수주/실패 처리 전</div>
        </div>
        <div class="card">
          <div class="label">수주 전환율</div>
          <div class="value">${s.convRate}%</div>
          <div class="sub">이번 달 마감 건 기준</div>
        </div>
      </div>
      <div class="panel">
        <h2>이번 달 목표 설정</h2>
        <div class="field" style="max-width:260px;">
          <label>${thisMonth} 목표 금액(원)</label>
          <input id="targetInput" type="text" inputmode="numeric" value="${state.targets[thisMonth]||""}" placeholder="예: 100000000">
        </div>
        <button class="primary" id="btnSaveTarget">저장</button>
      </div>
      <div class="panel">
        <h2>최근 견적/수주</h2>
        ${renderDealsTable(state.deals.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8), false)}
      </div>
    `;
  }

  function renderDeals(){
    const stages = ["전체","견적","수주","완료","실패"];
    const filtered = dealFilter === "전체" ? state.deals : state.deals.filter(d=>d.stage===dealFilter);
    const sorted = filtered.slice().sort((a,b)=>b.date.localeCompare(a.date));
    return `
      <div class="panel">
        <div class="toolbar">
          <div class="filters">
            ${stages.map(s=>`<button class="ghost${dealFilter===s?' active-filter':''}" data-filter="${s}" style="${dealFilter===s?'background:#eef2ff;color:var(--blue-dark);border-color:var(--blue);':''}">${s}</button>`).join("")}
          </div>
          <button class="primary" id="btnAddDeal">+ 새 견적/수주</button>
        </div>
        ${renderDealsTable(sorted, true)}
      </div>
    `;
  }

  function renderDealsTable(list, withActions){
    if(list.length === 0) return `<div class="empty">데이터가 없습니다.</div>`;
    return `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>날짜</th><th>거래처</th><th>담당자</th><th>품목</th><th>금액</th><th>상태</th>${withActions?'<th></th>':''}
        </tr></thead>
        <tbody>
          ${list.map(d => `
            <tr>
              <td>${d.date||""}</td>
              <td>${escapeHtml(d.company)}</td>
              <td>${escapeHtml(d.contact)}</td>
              <td>${escapeHtml(d.item)}</td>
              <td>${fmtWon(d.amount)}</td>
              <td><span class="badge ${d.stage}">${d.stage}</span></td>
              ${withActions ? `<td class="row-actions">
                <button class="ghost" data-edit="${d.id}">수정</button>
                <button class="ghost" data-del="${d.id}">삭제</button>
              </td>` : ''}
            </tr>
          `).join("")}
        </tbody>
      </table>
      </div>
    `;
  }

  function renderOrders(){
    return `
      ${renderSummaryTable()}
      <div class="panel">
        <div class="toolbar">
          <div></div>
          <button class="primary" id="btnAddOrder">+ 신규수주 입력</button>
        </div>
        ${renderOrdersByMonth()}
        <div class="sub" style="color:var(--muted);font-size:12px;margin-top:12px;">※ 신규수주 발생 시 여기에 입력하고, 매출처리(납품 완료로 인식) 되면 해당 건을 삭제하세요.</div>
      </div>
    `;
  }

  function renderOrdersByMonth(){
    let monthKeys = [...new Set(state.orders.map(o => monthGroupKey(o.date)))].sort((a,b)=>a.localeCompare(b));
    if(monthKeys.length === 0){
      monthKeys = [new Date().toISOString().slice(0,7)];
    }
    return monthKeys.map(key => `
      <div class="month-group-title">${monthGroupLabel(key)}</div>
      <div class="order-grid">
        ${BIZ_UNITS.map(u => renderOrderUnitBlock(u, state.orders.filter(o => o.region === u && monthGroupKey(o.date) === key))).join("")}
      </div>
    `).join("");
  }

  function renderSummaryTable(){
    const m = getMonthLabels();
    const rows = BIZ_UNITS.map(u => {
      const t = state.bizTargets[u];
      const sums = unitOrderSums(u);
      const expected = Number(t.actual||0) + sums.done + sums.pending;
      const rate = Number(t.target||0) > 0 ? (expected/Number(t.target))*100 : 0;
      const cumulative = Number(t.prev||0) + expected + Number(t.nextPlanned||0);
      return { u, t, sums, expected, rate, cumulative };
    });
    const totalPrev = rows.reduce((s,r)=>s+Number(r.t.prev||0),0);
    const totalTarget = rows.reduce((s,r)=>s+Number(r.t.target||0),0);
    const totalActual = rows.reduce((s,r)=>s+Number(r.t.actual||0),0);
    const totalDone = rows.reduce((s,r)=>s+r.sums.done,0);
    const totalPending = rows.reduce((s,r)=>s+r.sums.pending,0);
    const totalExpected = rows.reduce((s,r)=>s+r.expected,0);
    const totalRate = totalTarget > 0 ? (totalExpected/totalTarget)*100 : 0;
    const totalNext = rows.reduce((s,r)=>s+Number(r.t.nextPlanned||0),0);
    const totalCumulative = rows.reduce((s,r)=>s+r.cumulative,0);

    return `
      <div class="panel">
        <div class="toolbar">
          <h2 style="margin:0;">사업부별 매출 및 예상 실적 (${m.cur} 기준)</h2>
          <button class="ghost" id="btnLoadSample">샘플데이터 불러오기</button>
        </div>
        <div style="overflow-x:auto;">
        <table class="summary-table">
          <thead>
            <tr>
              <th rowspan="2">구분</th>
              <th rowspan="2">① ${m.prev} 누적매출</th>
              <th rowspan="2">사업부명</th>
              <th colspan="6">${m.cur} 매출실적</th>
              <th rowspan="2">⑦ ${m.next} 납품(선적)예정</th>
              <th rowspan="2">⑧ 연간 누적 예상 매출액</th>
            </tr>
            <tr>
              <th>② 매출목표</th>
              <th>③ 매출액(회계)</th>
              <th>④ 납품(선적)</th>
              <th>⑤ 미납품(미선적)</th>
              <th>⑥ 예상 매출액</th>
              <th>달성률</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r,i) => `
              <tr>
                ${i===0 ? `<td rowspan="${BIZ_UNITS.length}" style="text-align:center;font-weight:700;">금액</td>` : ''}
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="prev" value="${r.t.prev||0}"></td>
                <td class="biz-name">${r.u}</td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="target" value="${r.t.target||0}"></td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="actual" value="${r.t.actual||0}"></td>
                <td>${fmtWon(r.sums.done)}</td>
                <td>${fmtWon(r.sums.pending)}</td>
                <td>${fmtWon(r.expected)}</td>
                <td>${Number(r.t.target||0) > 0 ? r.rate.toFixed(1)+'%' : '-'}</td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="nextPlanned" value="${r.t.nextPlanned||0}"></td>
                <td>${fmtWon(r.cumulative)}</td>
              </tr>
            `).join("")}
            <tr class="total-row">
              <td>합계</td>
              <td>${fmtWon(totalPrev)}</td>
              <td></td>
              <td>${fmtWon(totalTarget)}</td>
              <td>${fmtWon(totalActual)}</td>
              <td>${fmtWon(totalDone)}</td>
              <td>${fmtWon(totalPending)}</td>
              <td>${fmtWon(totalExpected)}</td>
              <td>${totalTarget > 0 ? totalRate.toFixed(1)+'%' : '-'}</td>
              <td>${fmtWon(totalNext)}</td>
              <td>${fmtWon(totalCumulative)}</td>
            </tr>
          </tbody>
        </table>
        </div>
        <div class="sub" style="color:var(--muted);font-size:12px;margin-top:8px;">※ ①②③⑦은 직접 입력하는 회계/목표 수치입니다. ④⑤⑥⑧, 달성률은 아래 수주관리 데이터로 자동 계산됩니다.</div>
      </div>
    `;
  }

  function monthGroupKey(dateStr){
    return dateStr && dateStr.length >= 7 ? dateStr.slice(0,7) : "";
  }

  function monthGroupLabel(key){
    if(!key) return "날짜 미정";
    const m = Number(key.slice(5,7));
    return `${m}월 수주내역`;
  }

  function renderOrderMonthTable(monthOrders){
    const total = monthOrders.reduce((s,o) => s + Number(o.qty||0)*Number(o.price||0), 0);
    return `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>거래처명</th><th>제품명</th><th>수량</th><th>단가</th><th>금액</th><th>상태</th><th>납품(선적)일/예정일</th><th></th>
        </tr></thead>
        <tbody>
          ${monthOrders.map(o => `
            <tr>
              <td>${escapeHtml(o.company)}</td>
              <td>${escapeHtml(o.item)}</td>
              <td>${Number(o.qty||0).toLocaleString("ko-KR")}</td>
              <td>${fmtWon(o.price)}</td>
              <td>${fmtWon(Number(o.qty||0)*Number(o.price||0))}</td>
              <td><span class="badge ${o.status==='완료' ? '완료' : '미완료'}">${o.status==='완료' ? '완료' : '미완료'}</span></td>
              <td>${o.date||""}</td>
              <td class="row-actions">
                <button class="ghost" data-order-edit="${o.id}">수정</button>
                <button class="ghost" data-order-del="${o.id}">삭제</button>
              </td>
            </tr>
          `).join("")}
          <tr class="total-row"><td colspan="4">합계</td><td>${fmtWon(total)}</td><td colspan="3"></td></tr>
        </tbody>
      </table>
      </div>
    `;
  }

  function renderOrderUnitBlock(unit, list){
    const sorted = list.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return `
      <div class="region-block">
        <h3>${unit}</h3>
        ${sorted.length === 0 ? `<div class="empty">등록된 수주가 없습니다.</div>` : renderOrderMonthTable(sorted)}
      </div>
    `;
  }

  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function bindViewEvents(){
    document.getElementById("btnAddDeal")?.addEventListener("click", () => openModal());
    document.getElementById("btnSaveTarget")?.addEventListener("click", () => {
      const val = document.getElementById("targetInput").value.replace(/[^\d]/g,"");
      state.targets[thisMonth] = Number(val)||0;
      saveData(); render();
    });
    document.querySelectorAll("[data-filter]").forEach(b=>{
      b.addEventListener("click", () => { dealFilter = b.dataset.filter; render(); });
    });
    document.querySelectorAll("[data-edit]").forEach(b=>{
      b.addEventListener("click", () => openModal(b.dataset.edit));
    });
    document.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", () => {
        if(confirm("삭제하시겠습니까?")){
          state.deals = state.deals.filter(d => d.id !== b.dataset.del);
          saveData(); render();
        }
      });
    });
    document.getElementById("btnAddOrder")?.addEventListener("click", () => openOrderModal());
    document.querySelectorAll("[data-order-edit]").forEach(b=>{
      b.addEventListener("click", () => openOrderModal(b.dataset.orderEdit));
    });
    document.querySelectorAll("[data-order-del]").forEach(b=>{
      b.addEventListener("click", () => {
        if(confirm("삭제하시겠습니까? (매출처리 완료된 건은 삭제 후 일매출일보에 반영하세요)")){
          state.orders = state.orders.filter(o => o.id !== b.dataset.orderDel);
          saveData(); render();
        }
      });
    });
    document.querySelectorAll(".biz-input").forEach(inp=>{
      inp.addEventListener("change", () => {
        const unit = inp.dataset.biz;
        const field = inp.dataset.field;
        state.bizTargets[unit][field] = Number(inp.value.replace(/[^\d-]/g,""))||0;
        saveData(); render();
      });
    });
    document.getElementById("btnLoadSample")?.addEventListener("click", () => {
      if(confirm("엑셀 요약/일매출일보 시트의 사업부별 목표 수치와 신규수주 목록을 불러와 현재 입력값·수주 목록을 덮어씁니다. 계속할까요?")){
        BIZ_UNITS.forEach(u => { state.bizTargets[u] = { ...BIZ_SAMPLE[u] }; });
        state.orders = ORDER_SAMPLE.map(o => ({ id: uid(), ...o }));
        saveData(); render();
      }
    });
  }

  function openModal(id){
    editingId = id || null;
    const d = id ? state.deals.find(x=>x.id===id) : null;
    document.getElementById("modalTitle").textContent = id ? "견적/수주 수정" : "견적 추가";
    document.getElementById("f_company").value = d ? d.company : "";
    document.getElementById("f_contact").value = d ? d.contact : "";
    document.getElementById("f_item").value = d ? d.item : "";
    document.getElementById("f_amount").value = d ? d.amount : "";
    document.getElementById("f_stage").value = d ? d.stage : "견적";
    document.getElementById("f_date").value = d ? d.date : new Date().toISOString().slice(0,10);
    document.getElementById("f_memo").value = d ? (d.memo||"") : "";
    document.getElementById("modalBackdrop").classList.add("show");
  }
  function closeModal(){
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  document.getElementById("btnCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "modalBackdrop") closeModal();
  });
  document.getElementById("btnSave").addEventListener("click", () => {
    const company = document.getElementById("f_company").value.trim();
    if(!company){ alert("거래처를 입력하세요."); return; }
    const payload = {
      company,
      contact: document.getElementById("f_contact").value.trim(),
      item: document.getElementById("f_item").value.trim(),
      amount: Number(document.getElementById("f_amount").value.replace(/[^\d]/g,""))||0,
      stage: document.getElementById("f_stage").value,
      date: document.getElementById("f_date").value || new Date().toISOString().slice(0,10),
      memo: document.getElementById("f_memo").value.trim(),
    };
    if(editingId){
      const idx = state.deals.findIndex(d=>d.id===editingId);
      state.deals[idx] = { ...state.deals[idx], ...payload };
    } else {
      state.deals.push({ id: uid(), ...payload });
    }
    saveData();
    closeModal();
    render();
  });

  function updateOrderDateLabel(){
    const region = document.getElementById("o_region").value;
    const status = document.getElementById("o_status").value;
    const verb = region === "해외영업" ? "선적" : "납품";
    document.getElementById("o_dateLabel").textContent = status === "완료" ? `${verb}일` : `${verb}예정일`;
  }

  function openOrderModal(id){
    editingOrderId = id || null;
    const o = id ? state.orders.find(x=>x.id===id) : null;
    document.getElementById("orderModalTitle").textContent = id ? "신규수주 수정" : "신규수주 추가";
    document.getElementById("o_region").value = o ? o.region : "국내영업-제품";
    document.getElementById("o_company").value = o ? o.company : "";
    document.getElementById("o_item").value = o ? o.item : "";
    document.getElementById("o_qty").value = o ? o.qty : "";
    document.getElementById("o_price").value = o ? o.price : "";
    document.getElementById("o_status").value = o ? o.status : "예정";
    document.getElementById("o_date").value = o ? (o.date||"") : "";
    updateOrderDateLabel();
    document.getElementById("orderModalBackdrop").classList.add("show");
  }
  function closeOrderModal(){
    document.getElementById("orderModalBackdrop").classList.remove("show");
  }

  document.getElementById("o_region").addEventListener("change", updateOrderDateLabel);
  document.getElementById("o_status").addEventListener("change", updateOrderDateLabel);
  document.getElementById("btnOrderCancel").addEventListener("click", closeOrderModal);
  document.getElementById("orderModalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "orderModalBackdrop") closeOrderModal();
  });
  document.getElementById("btnOrderSave").addEventListener("click", () => {
    const company = document.getElementById("o_company").value.trim();
    if(!company){ alert("거래처명을 입력하세요."); return; }
    const payload = {
      region: document.getElementById("o_region").value,
      company,
      item: document.getElementById("o_item").value.trim(),
      qty: Number(document.getElementById("o_qty").value.replace(/[^\d]/g,""))||0,
      price: Number(document.getElementById("o_price").value.replace(/[^\d]/g,""))||0,
      status: document.getElementById("o_status").value,
      date: document.getElementById("o_date").value || "",
    };
    if(editingOrderId){
      const idx = state.orders.findIndex(o=>o.id===editingOrderId);
      state.orders[idx] = { ...state.orders[idx], ...payload };
    } else {
      state.orders.push({ id: uid(), ...payload });
    }
    saveData();
    closeOrderModal();
    render();
  });

  document.getElementById("nav").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if(!btn) return;
    view = btn.dataset.view;
    state.view = view;
    saveData();
    render();
  });

  render();
})();
</script>
</body>
</html>
