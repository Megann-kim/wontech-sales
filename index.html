<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원텍영업관리</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --bg:#f4f6f9; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:24px;height:56px;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;font-weight:700;margin:0;color:var(--blue-dark);white-space:nowrap;}
  nav{display:flex;gap:4px;}
  nav button{border:none;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;}
  nav button.active{background:var(--blue);color:#fff;}
  nav button:hover:not(.active){background:#eef2ff;}
  .order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:700px){ .order-grid{grid-template-columns:1fr;} }
  .region-block{margin-bottom:0;min-width:0;}
  .region-block table{font-size:12px;}
  .region-block h3{font-size:13px;font-weight:700;color:var(--blue-dark);margin:0 0 8px;}
  .month-group-title{font-size:26px;font-weight:800;margin:16px 0 8px;color:var(--text);}
  .month-group-title:first-of-type{margin-top:0;}
  .total-row td{font-weight:700;background:#f9fafb;}
  .badge.미완료{background:#fffbeb;color:var(--amber);}
  .summary-table{font-size:12px;white-space:nowrap;}
  .summary-table th{text-align:center;background:#f3f4f6;color:var(--text);}
  .summary-table td{text-align:center;}
  .summary-table td.biz-name{font-weight:600;}
  .summary-table td.qtr-cell{background:#f3f4f6;font-weight:700;}
  .target-table{width:auto;font-size:13px;}
  .target-table th,.target-table td{text-align:right;padding:8px 20px 8px 10px;white-space:nowrap;}
  .target-table th:first-child,.target-table td:first-child{text-align:center;}
  .target-table th{background:#f3f4f6;color:var(--text);}
  .biz-input{width:100px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:inherit;}
  main{width:100%;margin:0 auto;padding:24px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card .label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:800;}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
  .panel h2{font-size:15px;margin:0 0 14px;}
  .progress-bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:var(--blue);border-radius:6px;transition:width .3s;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  .table-scroll{overflow-x:auto;}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  tr:hover td{background:#f9fafb;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .toolbar .filters{display:flex;gap:6px;}
  .toolbar select,.toolbar input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  button.primary{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  button.primary:hover{background:var(--blue-dark);}
  button.ghost{background:none;border:1px solid var(--border);padding:6px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--muted);}
  button.ghost:hover{background:#f3f4f6;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.견적{background:#eef2ff;color:var(--blue-dark);}
  .badge.수주{background:#ecfdf5;color:var(--green);}
  .badge.완료{background:#f3f4f6;color:#374151;}
  .badge.실패{background:#fef2f2;color:var(--red);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:32px;width:640px;max-width:92vw;max-height:88vh;overflow:auto;}
  .modal h3{margin:0 0 22px;font-size:22px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;}
  .field input[readonly]{background:#f3f4f6;color:var(--muted);}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;min-width:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .modal-actions button{padding:10px 20px;font-size:15px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px;}
  .row-actions{display:flex;gap:6px;}
</style>
</head>
<body>

<header>
  <h1>원텍영업관리</h1>
  <nav id="nav">
    <button data-view="dash" class="active">대시보드</button>
    <button data-view="deals">견적/수주</button>
    <button data-view="orders">수주관리</button>
  </nav>
</header>

<main id="app"></main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">견적 추가</h3>
    <div class="field"><label>거래처</label><input id="f_company" type="text" placeholder="거래처명"></div>
    <div class="field"><label>담당자</label><input id="f_contact" type="text" placeholder="담당자명"></div>
    <div class="field"><label>품목</label><input id="f_item" type="text" placeholder="품목/내용"></div>
    <div class="field"><label>금액(원)</label><input id="f_amount" type="text" inputmode="numeric" placeholder="0"></div>
    <div class="field"><label>상태</label>
      <select id="f_stage">
        <option value="견적">견적</option>
        <option value="수주">수주</option>
        <option value="완료">완료</option>
        <option value="실패">실패</option>
      </select>
    </div>
    <div class="field"><label>날짜</label><input id="f_date" type="date"></div>
    <div class="field"><label>메모</label><textarea id="f_memo" rows="2" placeholder="메모"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" id="btnCancel">취소</button>
      <button class="primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="orderModalBackdrop">
  <div class="modal">
    <h3 id="orderModalTitle">신규수주 추가</h3>
    <div class="field"><label>구분</label>
      <select id="o_region">
        <option value="국내영업-제품">국내영업-제품</option>
        <option value="해외영업">해외영업</option>
        <option value="국내영업-소모품">국내영업-소모품</option>
        <option value="Surgical">Surgical</option>
        <option value="B2C">B2C</option>
        <option value="고객만족">고객만족</option>
      </select>
    </div>
    <div class="field"><label>거래처명</label><input id="o_company" type="text" placeholder="거래처명"></div>
    <div class="field"><label>제품명</label><input id="o_item" type="text" placeholder="제품명"></div>
    <div class="field" id="serialField" style="display:none;"><label>시리얼넘버(선택)</label><input id="o_serial" type="text" placeholder="예: 1434"></div>
    <div class="field"><label>수량</label><input id="o_qty" type="text" inputmode="numeric" placeholder="0"></div>
    <div class="field" id="krwPriceField"><label>단가(원)</label><input id="o_price" type="text" inputmode="numeric" placeholder="0"></div>
    <div id="usdCalc" style="display:none;">
      <div class="field-row">
        <div class="field"><label>달러단가($)</label><input id="o_usdPrice" type="text" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>달러금액($)</label><input id="o_usdAmount" type="text" readonly placeholder="0"></div>
        <div class="field"><label>원화환율</label><input id="o_exchangeRate" type="text" inputmode="decimal" placeholder="예: 1450"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>원화단가(원)</label><input id="o_krwUnitPrice" type="text" readonly placeholder="0"></div>
        <div class="field"><label>원화금액(원)</label><input id="o_krwAmount" type="text" readonly placeholder="0"></div>
      </div>
    </div>
    <div class="field"><label>상태</label>
      <select id="o_status">
        <option value="예정">미납품(미선적)</option>
        <option value="완료">납품(선적)완료</option>
      </select>
    </div>
    <div class="field"><label id="o_dateLabel">납품(선적)예정일</label><input id="o_date" type="date"></div>
    <div class="field">
      <label><input id="o_accountingConfirmed" type="checkbox" style="width:auto;margin-right:6px;">회계반영완료 (실제 회계 금액으로 확정)</label>
    </div>
    <div class="field" id="accountingAmountField" style="display:none;">
      <label>회계반영 금액(원)</label>
      <input id="o_accountingAmount" type="text" inputmode="numeric" placeholder="0">
    </div>
    <div class="modal-actions">
      <button class="ghost" id="btnOrderCancel">취소</button>
      <button class="primary" id="btnOrderSave">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="acctModalBackdrop">
  <div class="modal">
    <h3>회계 데이터 반영</h3>
    <p style="font-size:14px;color:var(--muted);margin:-10px 0 16px;">회계raw 시트에서 행 전체(헤더 포함)를 복사해 아래에 붙여넣으세요. 시리얼키 + 수량이 일치하는 해외영업 수주 건에 대변 금액을 자동 반영합니다.</p>
    <div class="field">
      <textarea id="acctRawData" rows="10" placeholder="엑셀에서 복사한 내용을 여기에 붙여넣기 (Ctrl+V)" style="font-family:monospace;font-size:12px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="btnAcctCancel">취소</button>
      <button class="primary" id="btnAcctRun">매칭 실행</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="pasteModalBackdrop">
  <div class="modal">
    <h3>신규수주 붙여넣기</h3>
    <p style="font-size:14px;color:var(--muted);margin:-10px 0 16px;">
      일매출일보 시트의 "2. 납품(선적) 및 미납품(미선적) 현황" 표에서 국내영업 또는 해외영업 쪽 헤더 2줄(거래처명·제품명·수량·단가·납품(선적)·미납품(미선적) 행)부터 데이터 끝까지 통째로 선택해 복사한 뒤 아래에 붙여넣으세요. 이미 있는 건(거래처+제품+수량+날짜 동일)은 건너뜁니다.
    </p>
    <div class="field">
      <label>구분</label>
      <select id="pasteRegionType">
        <option value="domestic">국내영업 (납품/미납품)</option>
        <option value="overseas">해외영업 (선적/미선적)</option>
      </select>
    </div>
    <div class="field">
      <textarea id="pasteRawData" rows="10" placeholder="엑셀에서 복사한 내용을 여기에 붙여넣기 (Ctrl+V)" style="font-family:monospace;font-size:12px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="btnPasteCancel">취소</button>
      <button class="primary" id="btnPasteRun">가져오기</button>
    </div>
  </div>
</div>

  let state = loadData();

  if(!state.selectedMonth) state.selectedMonth = thisMonth;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function getMonthLabels(){
    const now = new Date();
    const cur = now.getMonth()+1;
    const prev = cur === 1 ? 12 : cur-1;
    const next = cur === 12 ? 1 : cur+1;
    return { prev: `${prev}월`, cur: `${cur}월`, next: `${next}월` };
  }

  function orderAmount(o){
    if(o.accountingConfirmed) return Number(o.accountingAmount||0);
    return Number(o.qty||0) * Number(o.price||0);
  }

  function unitOrderSums(unit){
    const list = state.orders.filter(o => o.region === unit);
    const done = list.filter(o => o.status === "완료").reduce((s,o) => s + orderAmount(o), 0);
    const pending = list.filter(o => o.status !== "완료").reduce((s,o) => s + orderAmount(o), 0);
    return { done, pending };
  }

  function currentMonthIndex(){
    return Number(state.selectedMonth.slice(5,7)) - 1;
  }

  function monthlyTargetByUnit(unit){
    return Number((ANNUAL_TARGET_2026[unit]||[])[currentMonthIndex()]||0);
  }

  function computeOrderStats(){
    const target = BIZ_UNITS.reduce((s,u) => s + monthlyTargetByUnit(u), 0);
    const ordersThisMonth = state.orders.filter(o => monthGroupKey(o.date) === state.selectedMonth);
    const wonAmount = ordersThisMonth
      .filter(o => o.status === "완료")
      .reduce((s,o) => s + orderAmount(o), 0);
    const rate = target > 0 ? Math.round(wonAmount/target*100) : 0;
    const pendingCount = ordersThisMonth.filter(o => o.status !== "완료").length;
    const totalCount = ordersThisMonth.length;
    const doneCount = totalCount - pendingCount;
    const convRate = totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0;
    return { wonAmount, target, rate, pendingCount, convRate };
  }

  function computeDailyDelta(){
    const now = new Date();
    const todayStr = now.toISOString().slice(0,10);
    const yesterdayStr = new Date(now.getTime() - 86400000).toISOString().slice(0,10);
    const cumulativeAsOf = (dateStr) => state.orders
      .filter(o => o.status === "완료" && monthGroupKey(o.date) === state.selectedMonth && o.date && o.date <= dateStr)
      .reduce((s,o) => s + orderAmount(o), 0);
    const today = cumulativeAsOf(todayStr);
    const yesterday = cumulativeAsOf(yesterdayStr);
    return { today, yesterday, delta: today - yesterday };
  }

  function quarterSums(months){
    return [0,1,2,3].map(q => months.slice(q*3,q*3+3).reduce((a,b)=>a+b,0));

    for(let q=0; q<4; q++){

      }
      html += `<td class="qtr-cell">${fmtWon(quarters[q])}</td>`;
    }
    return html;
  }

      return { u, months, quarters, total };

    const totalMonths = Array.from({length:12}, (_,i) => rows.reduce((s,r)=>s+r.months[i],0));

  function renderDeltaPanel(){

    const d = computeDailyDelta();

    return `

  }

  function renderMonthSelector(){

  function renderSummaryTable(){

      return { u, t, sums, expected, rate, cumulative };
    });

    const totalRate = totalTarget > 0 ? (totalExpected/totalTarget)*100 : 0;
    const totalNext = rows.reduce((s,r)=>s+Number(r.t.nextPlanned||0),0);
    const totalCumulative = rows.reduce((s,r)=>s+r.cumulative,0);

    return `

              <th>② 매출목표</th>
              <th>③ 매출액(회계)</th>
              <th>④ 납품(선적)</th>
              <th>⑤ 미납품(미선적)</th>
              <th>⑥ 예상 매출액</th>
              <th>달성률</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r,i) => `
              <tr>
                ${i===0 ? `<td rowspan="${BIZ_UNITS.length}" style="text-align:center;font-weight:700;">금액</td>` : ''}
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="prev" value="${r.t.prev||0}"></td>
                <td class="biz-name">${r.u}</td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="target" value="${r.t.target||0}"></td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="actual" value="${r.t.actual||0}"></td>
                <td>${fmtWon(r.sums.done)}</td>
                <td>${fmtWon(r.sums.pending)}</td>
                <td>${fmtWon(r.expected)}</td>
                <td>${Number(r.t.target||0) > 0 ? r.rate.toFixed(1)+'%' : '-'}</td>
                <td><input type="text" inputmode="numeric" class="biz-input" data-biz="${r.u}" data-field="nextPlanned" value="${r.t.nextPlanned||0}"></td>
                <td>${fmtWon(r.cumulative)}</td>
              </tr>
            `).join("")}
            <tr class="total-row">
              <td>합계</td>
              <td>${fmtWon(totalPrev)}</td>
              <td></td>
              <td>${fmtWon(totalTarget)}</td>
              <td>${fmtWon(totalActual)}</td>
              <td>${fmtWon(totalDone)}</td>
              <td>${fmtWon(totalPending)}</td>
              <td>${fmtWon(totalExpected)}</td>
              <td>${totalTarget > 0 ? totalRate.toFixed(1)+'%' : '-'}</td>
              <td>${fmtWon(totalNext)}</td>
              <td>${fmtWon(totalCumulative)}</td>
            </tr>
          </tbody>
        </table>
        </div>
        <div class="sub" style="color:var(--muted);font-size:12px;margin-top:8px;">※ ①②③⑦은 직접 입력하는 회계/목표 수치입니다. ④⑤⑥⑧, 달성률은 아래 수주관리 데이터로 자동 계산됩니다.</div>
      </div>
    `;
  }

  function monthGroupKey(dateStr){
    return dateStr && dateStr.length >= 7 ? dateStr.slice(0,7) : "";
  }

  function monthGroupLabel(key){
    if(!key) return "날짜 미정";
    const m = Number(key.slice(5,7));
    return `${m}월 수주내역`;
  }

  function renderOrderMonthTable(monthOrders){
    const total = monthOrders.reduce((s,o) => s + orderAmount(o), 0);
    return `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>거래처명</th><th>제품명</th><th>시리얼넘버</th><th>수량</th><th>단가</th><th>금액</th><th>상태</th><th>회계반영</th><th>납품(선적)일/예정일</th><th></th>
        </tr></thead>
        <tbody>
          ${monthOrders.map(o => `
            <tr>
              <td>${escapeHtml(o.company)}</td>
              <td>${escapeHtml(o.item)}</td>
              <td>${escapeHtml(o.serialNo||"")}</td>
              <td>${Number(o.qty||0).toLocaleString("ko-KR")}</td>
              <td>${fmtWon(o.price)}</td>
              <td>${fmtWon(orderAmount(o))}</td>
              <td><span class="badge ${o.status==='완료' ? '완료' : '미완료'}">${o.status==='완료' ? '완료' : '미완료'}</span></td>
              <td>${o.accountingConfirmed ? '<span class="badge 완료">반영완료</span>' : '<span class="badge 미완료">미반영</span>'}</td>
              <td>${o.date||""}</td>
              <td class="row-actions">
                <button class="ghost" data-order-edit="${o.id}">수정</button>
                <button class="ghost" data-order-del="${o.id}">삭제</button>
              </td>
            </tr>
          `).join("")}
          <tr class="total-row"><td colspan="5">합계</td><td>${fmtWon(total)}</td><td colspan="4"></td></tr>
        </tbody>
      </table>
      </div>
    `;
  }

  function renderOrderUnitBlock(unit, list){
    const sorted = list.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return `
      <div class="region-block">
        <h3>${unit}</h3>
        ${sorted.length === 0 ? `<div class="empty">등록된 수주가 없습니다.</div>` : renderOrderMonthTable(sorted)}
      </div>
    `;
  }

  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function bindViewEvents(){
    document.getElementById("dashMonthSelect")?.addEventListener("change", (e) => {
      state.selectedMonth = e.target.value;
      saveData(); render();
    });
    document.getElementById("btnResetMonth")?.addEventListener("click", () => {
      state.selectedMonth = thisMonth;
      saveData(); render();
    });
    document.getElementById("ordersMonthFilter")?.addEventListener("change", (e) => {
      state.ordersMonthFilter = e.target.value;
      saveData(); render();
    });
    document.getElementById("btnAddDeal")?.addEventListener("click", () => openModal());
    document.querySelectorAll("[data-filter]").forEach(b=>{
      b.addEventListener("click", () => { dealFilter = b.dataset.filter; render(); });
    });
    document.querySelectorAll("[data-edit]").forEach(b=>{
      b.addEventListener("click", () => openModal(b.dataset.edit));
    });
    document.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", () => {
        if(confirm("삭제하시겠습니까?")){
          state.deals = state.deals.filter(d => d.id !== b.dataset.del);
          saveData(); render();
        }
      });
    });
    document.getElementById("btnAddOrder")?.addEventListener("click", () => openOrderModal());
    document.getElementById("btnAcctMatch")?.addEventListener("click", () => {
      document.getElementById("acctRawData").value = "";
      document.getElementById("acctModalBackdrop").classList.add("show");
    });
    document.getElementById("btnPasteOpen")?.addEventListener("click", () => {
      document.getElementById("pasteRawData").value = "";
      document.getElementById("pasteModalBackdrop").classList.add("show");
    });
    document.querySelectorAll("[data-order-edit]").forEach(b=>{
      b.addEventListener("click", () => openOrderModal(b.dataset.orderEdit));
    });
    document.querySelectorAll("[data-order-del]").forEach(b=>{
      b.addEventListener("click", () => {
        if(confirm("삭제하시겠습니까? (매출처리 완료된 건은 삭제 후 일매출일보에 반영하세요)")){
          state.orders = state.orders.filter(o => o.id !== b.dataset.orderDel);
          saveData(); render();
        }
      });
    });
    document.querySelectorAll(".biz-input").forEach(inp=>{
      inp.addEventListener("change", () => {
        const unit = inp.dataset.biz;
        const field = inp.dataset.field;
        state.bizTargets[unit][field] = Number(inp.value.replace(/[^\d-]/g,""))||0;
        saveData(); render();
      });
    });
    document.getElementById("btnLoadSample")?.addEventListener("click", () => {
      if(confirm("엑셀 요약/일매출일보 시트의 사업부별 목표 수치와 신규수주 목록을 불러와 현재 입력값·수주 목록을 덮어씁니다. 계속할까요?")){
        BIZ_UNITS.forEach(u => { state.bizTargets[u] = { ...BIZ_SAMPLE[u] }; });
        state.orders = ORDER_SAMPLE.map(o => ({ id: uid(), ...o }));
        saveData(); render();
      }
    });
  }

  function openModal(id){
    editingId = id || null;
    const d = id ? state.deals.find(x=>x.id===id) : null;
    document.getElementById("modalTitle").textContent = id ? "견적/수주 수정" : "견적 추가";
    document.getElementById("f_company").value = d ? d.company : "";
    document.getElementById("f_contact").value = d ? d.contact : "";
    document.getElementById("f_item").value = d ? d.item : "";
    document.getElementById("f_amount").value = d ? d.amount : "";
    document.getElementById("f_stage").value = d ? d.stage : "견적";
    document.getElementById("f_date").value = d ? d.date : new Date().toISOString().slice(0,10);
    document.getElementById("f_memo").value = d ? (d.memo||"") : "";
    document.getElementById("modalBackdrop").classList.add("show");
  }
  function closeModal(){
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  document.getElementById("btnCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "modalBackdrop") closeModal();
  });
  document.getElementById("btnSave").addEventListener("click", () => {
    const company = document.getElementById("f_company").value.trim();
    if(!company){ alert("거래처를 입력하세요."); return; }
    const payload = {
      company,
      contact: document.getElementById("f_contact").value.trim(),
      item: document.getElementById("f_item").value.trim(),
      amount: Number(document.getElementById("f_amount").value.replace(/[^\d]/g,""))||0,
      stage: document.getElementById("f_stage").value,
      date: document.getElementById("f_date").value || new Date().toISOString().slice(0,10),
      memo: document.getElementById("f_memo").value.trim(),
    };
    if(editingId){
      const idx = state.deals.findIndex(d=>d.id===editingId);
      state.deals[idx] = { ...state.deals[idx], ...payload };
    } else {
      state.deals.push({ id: uid(), ...payload });
    }
    saveData();
    closeModal();
    render();
  });

  function updateOrderDateLabel(){
    const region = document.getElementById("o_region").value;
    const status = document.getElementById("o_status").value;
    const verb = region === "해외영업" ? "선적" : "납품";
    document.getElementById("o_dateLabel").textContent = status === "완료" ? `${verb}일` : `${verb}예정일`;
  }

  function updateUsdCalcVisibility(){
    const isOverseas = document.getElementById("o_region").value === "해외영업";
    document.getElementById("usdCalc").style.display = isOverseas ? "block" : "none";
    document.getElementById("krwPriceField").style.display = isOverseas ? "none" : "block";
    document.getElementById("serialField").style.display = isOverseas ? "block" : "none";
  }

  function num(id){
    return Number(document.getElementById(id).value.replace(/[^\d.]/g,"")) || 0;
  }

  function recomputeUsdCalc(){
    const qty = num("o_qty");
    const usdPrice = num("o_usdPrice");
    const rate = num("o_exchangeRate");
    const usdAmount = qty * usdPrice;
    const krwUnitPrice = usdPrice * rate;
    const krwAmount = qty * krwUnitPrice;
    document.getElementById("o_usdAmount").value = usdAmount ? usdAmount.toLocaleString("en-US") : "";
    document.getElementById("o_krwUnitPrice").value = krwUnitPrice ? Math.round(krwUnitPrice).toLocaleString("ko-KR") : "";
    document.getElementById("o_krwAmount").value = krwAmount ? Math.round(krwAmount).toLocaleString("ko-KR") : "";
    document.getElementById("o_price").value = Math.round(krwUnitPrice) || 0;
  }

  function openOrderModal(id){
    editingOrderId = id || null;
    const o = id ? state.orders.find(x=>x.id===id) : null;
    document.getElementById("orderModalTitle").textContent = id ? "신규수주 수정" : "신규수주 추가";
    document.getElementById("o_region").value = o ? o.region : "국내영업-제품";
    document.getElementById("o_company").value = o ? o.company : "";
    document.getElementById("o_item").value = o ? o.item : "";
    document.getElementById("o_serial").value = o ? (o.serialNo||"") : "";
    document.getElementById("o_qty").value = o ? o.qty : "";
    document.getElementById("o_price").value = o ? o.price : "";
    document.getElementById("o_usdPrice").value = o && o.usdPrice ? o.usdPrice : "";
    document.getElementById("o_exchangeRate").value = o && o.exchangeRate ? o.exchangeRate : "";
    document.getElementById("o_status").value = o ? o.status : "예정";
    document.getElementById("o_date").value = o ? (o.date||"") : "";
    document.getElementById("o_accountingConfirmed").checked = !!(o && o.accountingConfirmed);
    document.getElementById("o_accountingAmount").value = o && o.accountingAmount ? o.accountingAmount : "";
    updateOrderDateLabel();
    updateUsdCalcVisibility();
    recomputeUsdCalc();
    updateAccountingFieldVisibility();
    document.getElementById("orderModalBackdrop").classList.add("show");
  }
  function closeOrderModal(){
    document.getElementById("orderModalBackdrop").classList.remove("show");
  }

  function updateAccountingFieldVisibility(){
    document.getElementById("accountingAmountField").style.display =
      document.getElementById("o_accountingConfirmed").checked ? "block" : "none";
  }

  document.getElementById("o_region").addEventListener("change", () => { updateOrderDateLabel(); updateUsdCalcVisibility(); recomputeUsdCalc(); });
  document.getElementById("o_status").addEventListener("change", updateOrderDateLabel);
  document.getElementById("o_accountingConfirmed").addEventListener("change", updateAccountingFieldVisibility);
  ["o_qty","o_usdPrice","o_exchangeRate"].forEach(id => {
    document.getElementById(id).addEventListener("input", recomputeUsdCalc);
  });
  document.getElementById("btnOrderCancel").addEventListener("click", closeOrderModal);
  document.getElementById("orderModalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "orderModalBackdrop") closeOrderModal();
  });
  document.getElementById("btnOrderSave").addEventListener("click", () => {
    const company = document.getElementById("o_company").value.trim();
    if(!company){ alert("거래처명을 입력하세요."); return; }
    const region = document.getElementById("o_region").value;
    const payload = {
      region,
      company,
      item: document.getElementById("o_item").value.trim(),
      serialNo: region === "해외영업" ? document.getElementById("o_serial").value.trim() : "",
      qty: Number(document.getElementById("o_qty").value.replace(/[^\d]/g,""))||0,
      price: Number(document.getElementById("o_price").value.replace(/[^\d]/g,""))||0,
      status: document.getElementById("o_status").value,
      date: document.getElementById("o_date").value || "",
      usdPrice: region === "해외영업" ? num("o_usdPrice") : 0,
      exchangeRate: region === "해외영업" ? num("o_exchangeRate") : 0,
      accountingConfirmed: document.getElementById("o_accountingConfirmed").checked,
      accountingAmount: num("o_accountingAmount"),
    };
    if(editingOrderId){
      const idx = state.orders.findIndex(o=>o.id===editingOrderId);
      state.orders[idx] = { ...state.orders[idx], ...payload };
    } else {
      state.orders.push({ id: uid(), ...payload });
    }
    saveData();
    closeOrderModal();
    render();
  });

  function parseKRW(str){
    return Number(String(str||"").replace(/[^0-9.-]/g,""))||0;
  }

  function closeAcctModal(){
    document.getElementById("acctModalBackdrop").classList.remove("show");
  }
  document.getElementById("btnAcctCancel").addEventListener("click", closeAcctModal);
  document.getElementById("acctModalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "acctModalBackdrop") closeAcctModal();
  });
  document.getElementById("btnAcctRun").addEventListener("click", () => {
    const raw = document.getElementById("acctRawData").value;
    const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
    if(lines.length < 2){ alert("헤더 행과 데이터 행을 포함해 붙여넣어 주세요."); return; }
    const header = lines[0].split("\t").map(h => h.trim());
    const idxSerial = header.indexOf("시리얼키");
    const idxQty = header.indexOf("수량");
    const idxCredit = header.indexOf("대변");
    if(idxSerial === -1 || idxQty === -1 || idxCredit === -1){
      alert("헤더에서 '시리얼키', '수량', '대변' 열을 찾지 못했습니다. 회계raw 시트의 헤더 행을 포함해서 붙여넣었는지 확인해주세요.");
      return;
    }
    let matched = 0, noSerial = 0, noMatch = 0;
    const unmatchedSerials = [];
    for(let i=1; i<lines.length; i++){
      const cols = lines[i].split("\t");
      const serial = (cols[idxSerial]||"").trim();
      const qty = parseKRW(cols[idxQty]);
      const credit = parseKRW(cols[idxCredit]);
      if(!serial){ noSerial++; continue; }
      const order = state.orders.find(o =>
        o.region === "해외영업" &&
        String(o.serialNo||"").trim() === serial &&
        Number(o.qty) === qty &&
        !o.accountingConfirmed
      );
      if(order){
        order.accountingConfirmed = true;
        order.accountingAmount = credit;
        matched++;
      } else {
        noMatch++;
        unmatchedSerials.push(`${serial} (수량 ${qty})`);
      }
    }
    saveData();
    closeAcctModal();
    render();
    let msg = `자동 반영 완료: ${matched}건\n시리얼넘버 없어 스킵: ${noSerial}건 (수기 입력 필요)\n시리얼넘버는 있으나 일치하는 수주 없음: ${noMatch}건`;
    if(unmatchedSerials.length > 0){
      msg += `\n\n일치 안 된 시리얼: ${unmatchedSerials.slice(0,20).join(", ")}${unmatchedSerials.length>20?" 외 "+(unmatchedSerials.length-20)+"건":""}`;
    }
    alert(msg);
  });

  function parseKoreanDate(str){
    const m = String(str||"").match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if(!m) return "";
    const mm = String(m[1]).padStart(2,"0");
    const dd = String(m[2]).padStart(2,"0");
    return `2026-${mm}-${dd}`;
  }

  function isTipItem(name){
    return /tip/i.test(name||"");
  }

  function closePasteModal(){
    document.getElementById("pasteModalBackdrop").classList.remove("show");
  }
  document.getElementById("btnPasteCancel").addEventListener("click", closePasteModal);
  document.getElementById("pasteModalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "pasteModalBackdrop") closePasteModal();
  });
  document.getElementById("btnPasteRun").addEventListener("click", () => {
    const type = document.getElementById("pasteRegionType").value;
    const raw = document.getElementById("pasteRawData").value;
    const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
    if(lines.length < 3){ alert("헤더 2줄과 데이터 행을 포함해 붙여넣어 주세요."); return; }
    const h1 = lines[0].split("\t").map(c => c.trim());
    const h2 = lines[1].split("\t").map(c => c.trim());

    const idxCompany = h1.indexOf("거래처명");
    const idxItem = h1.indexOf("제품명");
    const idxQty = h1.indexOf("수량");
    const idxPrice = h1.indexOf("단가");
    const idxDoneCol = h1.indexOf(type === "domestic" ? "납품" : "선적");
    const idxPendCol = h1.indexOf(type === "domestic" ? "미납품" : "미선적");
    const idxDoneDate = h2.indexOf("납품(선적)일");
    const idxPendDate = h2.indexOf("납품(선적)예정일");

    if([idxCompany, idxItem, idxQty, idxPrice, idxDoneCol, idxPendCol, idxDoneDate, idxPendDate].some(i => i === -1)){
      alert("헤더에서 거래처명/제품명/수량/단가/납품(또는 선적)/미납품(또는 미선적)/날짜 열을 찾지 못했습니다. 표의 헤더 2줄(예: 거래처명·제품명·수량·단가 있는 줄과 그 바로 아래 금액·날짜 있는 줄)을 정확히 포함해서 붙여넣었는지 확인해주세요.");
      return;
    }

    let added = 0, skipped = 0, parseFail = 0;
    for(let i=2; i<lines.length; i++){
      const cols = lines[i].split("\t");
      const company = (cols[idxCompany]||"").trim();
      if(!company) continue;
      const item = (cols[idxItem]||"").trim();
      const qty = parseKRW(cols[idxQty]);
      const price = parseKRW(cols[idxPrice]);
      const doneAmt = parseKRW(cols[idxDoneCol]);
      const pendAmt = parseKRW(cols[idxPendCol]);
      let status, date;
      if(doneAmt > 0){ status = "완료"; date = parseKoreanDate(cols[idxDoneDate]); }
      else if(pendAmt > 0){ status = "예정"; date = parseKoreanDate(cols[idxPendDate]); }
      else { continue; }
      if(!qty || !price){ parseFail++; continue; }
      const region = type === "overseas" ? "해외영업" : (isTipItem(item) ? "국내영업-소모품" : "국내영업-제품");
      const dup = state.orders.some(x =>
        x.region === region && x.company === company && x.item === item &&
        Number(x.qty) === qty && x.date === date
      );
      if(dup){ skipped++; continue; }
      state.orders.push({
        id: uid(), region, company, item, qty, price, status, date,
        usdPrice:0, exchangeRate:0, accountingConfirmed:false, accountingAmount:0, serialNo:""
      });
      added++;
    }
    saveData();
    closePasteModal();
    render();
    alert(`가져오기 완료: ${added}건 추가${skipped>0 ? `, ${skipped}건 중복이라 건너뜀` : ""}${parseFail>0 ? `, ${parseFail}건 수량/단가 인식 실패` : ""}`);
  });

  document.getElementById("nav").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if(!btn) return;
    view = btn.dataset.view;
    state.view = view;
    saveData();
    render();
  });

  render();
})();
</script>
</body>
</html>
